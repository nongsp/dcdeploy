<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>全球宏观资产动态关系图</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    background:
        radial-gradient(circle at 20% 20%,rgba(40,120,220,.12),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(180,90,30,.10),transparent 30%),
        #06101d;

    color:#eaf2fb;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

    overflow:hidden;
}


/* ================= HEADER ================= */

header{

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    background:rgba(4,11,22,.90);

    border-bottom:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    position:relative;

    z-index:20;
}

.logo{

    font-size:20px;
    font-weight:800;
    letter-spacing:.5px;
}

.logo span{
    color:#57b5ff;
}

.subtitle{

    margin-top:3px;

    color:#7f91a8;

    font-size:11px;
}

.header-right{

    display:flex;

    gap:7px;

    align-items:center;
}

button{

    border:1px solid rgba(255,255,255,.12);

    background:rgba(255,255,255,.05);

    color:#dbe8f6;

    padding:8px 12px;

    border-radius:7px;

    cursor:pointer;

    transition:.2s;

    font-size:12px;
}

button:hover{

    background:rgba(70,160,230,.2);

    border-color:#4e9ddd;
}

button.active{

    background:rgba(66,160,235,.28);

    border-color:#5db5ff;
}


/* ================= LAYOUT ================= */

.layout{

    height:calc(100vh - 70px);

    display:grid;

    grid-template-columns:minmax(600px,1fr) 350px;
}

#mindmap{

    position:relative;

    overflow:hidden;
}

svg{

    width:100%;
    height:100%;

    cursor:grab;
}

svg:active{

    cursor:grabbing;
}


/* ================= CONNECTION ================= */

.link{

    fill:none;

    stroke-width:2;

    opacity:.48;

    transition:
        stroke .4s,
        opacity .4s,
        stroke-width .4s;
}

.link.positive{

    stroke:#31d47b;

}

.link.negative{

    stroke:#ff5866;

}

.link.mixed{

    stroke:#efbd4f;

    stroke-dasharray:8 5;
}


/* 动态连接 */

.link.active-flow{

    stroke-width:5;

    opacity:1;

    stroke-dasharray:12 8;

    animation:
        flow 1s linear infinite;
}

@keyframes flow{

    to{
        stroke-dashoffset:-40;
    }

}


/* ================= NODE ================= */

.node{

    cursor:pointer;
}

.node circle{

    stroke-width:2;

    transition:

        r .35s,

        opacity .3s,

        stroke-width .3s,

        filter .3s;
}

.node:hover circle{

    filter:
        drop-shadow(0 0 13px rgba(100,190,255,.8));
}

.node-title{

    fill:white;

    font-size:14px;

    font-weight:750;
}

.node-sub{

    fill:#91a5bb;

    font-size:10px;
}

.center circle{

    fill:#12344f;

    stroke:#5bb7ff;

    stroke-width:3;
}

.center .node-title{

    font-size:19px;
}


/* ================= STATUS ================= */

.status-badge{

    font-size:13px;

    font-weight:800;

    pointer-events:none;
}

.status-up{

    fill:#42df87;
}

.status-down{

    fill:#ff626d;
}

.status-neutral{

    fill:#eec45a;
}

.node-highlight{

    animation:
        nodePulse 1.1s ease-in-out infinite;
}

@keyframes nodePulse{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.55;
    }
}


/* ================= PANEL ================= */

.panel{

    border-left:1px solid rgba(255,255,255,.08);

    background:rgba(5,13,25,.94);

    padding:18px;

    overflow-y:auto;
}

.panel h2{

    margin:0;

    font-size:19px;
}

.panel-desc{

    margin-top:7px;

    font-size:12px;

    line-height:1.65;

    color:#91a4ba;
}


/* ================= SCENARIO ================= */

.scenario-box{

    margin-top:15px;

    padding:13px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.035);
}

.scenario-title{

    font-size:12px;

    color:#91a5bb;

    margin-bottom:9px;
}

.scenario-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:7px;
}

.scenario-grid button{

    font-size:11px;

    padding:8px 5px;
}


/* ================= RESPONSE ================= */

.response{

    margin-top:15px;
}

.response-row{

    display:grid;

    grid-template-columns:80px 45px 1fr;

    align-items:center;

    gap:7px;

    padding:8px 0;

    border-bottom:1px solid rgba(255,255,255,.055);

    font-size:11px;
}

.response-row:last-child{

    border-bottom:0;
}

.asset{

    color:#dce8f5;

    font-weight:600;
}

.direction{

    text-align:center;

    font-size:15px;

    font-weight:800;
}

.reason{

    color:#8396ad;

    line-height:1.4;
}


/* ================= CHAIN ================= */

.chain{

    margin-top:15px;

    padding:13px;

    border-radius:10px;

    background:rgba(70,150,230,.055);

    border:1px solid rgba(70,150,230,.13);
}

.chain-title{

    color:#8fcaff;

    font-size:12px;

    margin-bottom:10px;
}

.chain-flow{

    font-size:12px;

    line-height:2;

    color:#dbe8f5;
}

.arrow{

    color:#6e8ca9;

    padding:0 3px;
}


/* ================= LEGEND ================= */

.legend{

    position:absolute;

    left:18px;

    bottom:18px;

    background:rgba(4,12,24,.82);

    padding:10px 13px;

    border-radius:8px;

    color:#8295ab;

    font-size:10px;

    backdrop-filter:blur(10px);
}

.legend div{

    margin:4px 0;
}

.dot{

    display:inline-block;

    width:8px;

    height:8px;

    border-radius:50%;

    margin-right:5px;
}

.green{
    background:#35d07f;
}

.red{
    background:#ff5964;
}

.yellow{
    background:#efbd4f;
}


/* ================= RESPONSIVE ================= */

@media(max-width:900px){

    .layout{

        grid-template-columns:1fr;
    }

    .panel{

        display:none;
    }

    .header-right{

        display:none;
    }
}

</style>
</head>

/* =====================================================

===================================================== */

function runScenario(type){

    const s = scenarios[type];

    if(!s) return;


    /* ================= 标题 ================= */

    document.getElementById("panelTitle").innerText =
        s.title;


    document.getElementById("panelDesc").innerText =
        "这是一个宏观情景模拟。箭头表示典型历史关系，并不代表每次市场都会按照同一方向运行。";


    /* ================= 传导链 ================= */

    document.getElementById("chain").innerHTML =
        s.chain.map((x,i)=>{

            if(i === s.chain.length-1)
                return x;

            return x +
            '<span class="arrow">→</span>';

        }).join("");


    /* ================= 清除旧状态 ================= */

    document.querySelectorAll(".node")
        .forEach(n => n.classList.remove("node-highlight"));

    document.querySelectorAll(".link")
        .forEach(l => l.classList.remove("active-flow"));


    /* ================= 激活节点 ================= */

    s.active.forEach(id=>{

        const n =
            document.getElementById("node-"+id);

        if(n)
            n.classList.add("node-highlight");

    });


    /* ================= 激活路径 ================= */

    s.flows.forEach(id=>{

        const l =
            document.getElementById(id);

        if(l)
            l.classList.add("active-flow");

    });


    /* ================= 资产响应 ================= */

    Object.entries(s.values).forEach(([asset,v])=>{

        const dir =
            document.getElementById("r-"+asset);

        const reason =
            document.getElementById("reason-"+asset);

        const status =
            document.getElementById("status-"+asset);


        if(dir){

            dir.innerText = v[0];

            dir.className =
                "direction "+
                (
                    v[2] === "up"
                    ? "status-up"
                    : v[2] === "down"
                    ? "status-down"
                    : "status-neutral"
                );

        }


        if(reason)
            reason.innerText = v[1];


        if(status){

            status.innerText = v[0];

            status.className =
                "status-badge "+
                (
                    v[2] === "up"
                    ? "status-up"
                    : v[2] === "down"
                    ? "status-down"
                    : "status-neutral"
                );

        }

    });

}


/* =====================================================
   ZOOM / PAN
===================================================== */

const svg =
    document.getElementById("svg");

const world =
    document.getElementById("world");


let scale = 1;

let tx = 0;

let ty = 0;


function updateTransform(){

    world.setAttribute(
        "transform",
        `translate(${tx},${ty}) scale(${scale})`
    );

}


function zoomIn(){

    scale *= 1.15;

    scale =
        Math.min(scale,2.5);

    updateTransform();

}


function zoomOut(){

    scale /= 1.15;

    scale =
        Math.max(scale,.55);

    updateTransform();

}


function resetView(){

    scale=1;

    tx=0;

    ty=0;

    updateTransform();

}


/* =====================================================
   DRAG
===================================================== */

let dragging=false;

let startX=0;

let startY=0;


svg.addEventListener(
    "mousedown",
    e=>{

        dragging=true;

        startX=e.clientX;

        startY=e.clientY;

    }
);


window.addEventListener(
    "mouseup",
    ()=>{
        dragging=false;
    }
);


window.addEventListener(
    "mousemove",
    e=>{

        if(!dragging)
            return;


        const rect =
            svg.getBoundingClientRect();


        const dx =
            (e.clientX-startX)
            /rect.width*1450;


        const dy =
            (e.clientY-startY)
            /rect.height*900;


        tx+=dx;

        ty+=dy;


        startX=e.clientX;

        startY=e.clientY;


        updateTransform();

    }
);


/* =====================================================
   WHEEL ZOOM
===================================================== */

svg.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();

        if(e.deltaY<0)
            scale*=1.08;
        else
            scale/=1.08;


        scale =
            Math.max(
                .55,
                Math.min(scale,2.5)
            );


        updateTransform();

    },
    {passive:false}
);


/* =====================================================
   INITIAL
===================================================== */
